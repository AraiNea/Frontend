name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pizza
          POSTGRES_USER: pizzauser
          POSTGRES_PASSWORD: pizzapass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pizzauser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: jdbc:postgresql://postgres:5432/pizza
      DB_USERNAME: pizzauser
      DB_PASSWORD: pizzapass
      JWT_SECRET: mysupersecuresecretthatatleast32characterslong
      VITE_API_URL: http://arainea-backend.arainea.svc.cluster.local:8080

    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: |
          docker build . \
            --file Dockerfile \
            --build-arg VITE_API_URL=${{ env.VITE_API_URL }} \
            -t cxgdn/arainea-frontend:latest

      - name: Login to Docker Hub
        run: docker login -u cxgdn -p dckr_pat_NQDxIKYdnllF5XD5HRDypIEYy1U

      - name: Push image
        run: docker push cxgdn/arainea-frontend:latest

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Checkout Deployment repo
        uses: actions/checkout@v4
        with:
          repository: AraiNea/Deployment
          path: deployment

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Apply manifests
        run: |
          kubectl apply -f deployment/k8s/namespace.yaml
          sleep 3
          kubectl apply -f deployment/k8s/
          
  cypress:
    needs: build # ยังคงต้องพึ่งพา build เพื่อให้แน่ใจว่า backend image ถูกสร้างแล้ว
    runs-on: ubuntu-latest
    
    # 🚨 ลบ services ออกทั้งหมด เพราะจะใช้ Docker Compose แทน
    
    steps:
      - uses: actions/checkout@v4
      
      # 🌟 NEW: ติดตั้ง Docker Compose 🌟
      - name: Install Docker Compose
        run: sudo curl -L "https://github.com/docker/compose/releases/download/v2.27.1/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose && sudo chmod +x /usr/local/bin/docker-compose

      # 🌟 NEW: รัน Services ด้วย Docker Compose 🌟
      - name: Start services using Docker Compose
        # ใช้ -d เพื่อรันใน background และรอจนกว่า service จะ health (ใช้เวลาสักพัก)
        run: docker-compose -f docker-compose.test.yml up -d --build --wait

      # 4️⃣ Run Cypress tests
      # Cypress จะสามารถเข้าถึง http://localhost:3000 ได้ และ frontend จะคุยกับ backend:8080 ได้
      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          # ไม่ต้องรอด้วย wait-on แล้ว เพราะ compose ได้รอ healthcheck ให้แล้ว
          browser: chrome
        env:
          CYPRESS_BASE_URL: http://localhost:3000
