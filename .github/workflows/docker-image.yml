name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pizza
          POSTGRES_USER: pizzauser
          POSTGRES_PASSWORD: pizzapass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pizzauser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_URL: jdbc:postgresql://postgres:5432/pizza
      DB_USERNAME: pizzauser
      DB_PASSWORD: pizzapass
      JWT_SECRET: mysupersecuresecretthatatleast32characterslong
      VITE_API_URL: http://arainea-backend.arainea.svc.cluster.local:8080

    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: |
          docker build . \
            --file Dockerfile \
            --build-arg VITE_API_URL=${{ env.VITE_API_URL }} \
            -t cxgdn/arainea-frontend:latest

      - name: Login to Docker Hub
        run: docker login -u cxgdn -p dckr_pat_NQDxIKYdnllF5XD5HRDypIEYy1U

      - name: Push image
        run: docker push cxgdn/arainea-frontend:latest

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Checkout Deployment repo
        uses: actions/checkout@v4
        with:
          repository: AraiNea/Deployment
          path: deployment

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Apply manifests
        run: |
          kubectl apply -f deployment/k8s/namespace.yaml
          sleep 3
          kubectl apply -f deployment/k8s/
          
  cypress:
    needs: build
    runs-on: ubuntu-latest
  
    steps:
      - uses: actions/checkout@v4
  
      # 1️⃣ Build frontend Docker image
      - name: Build frontend Docker image
        run: docker build . -t frontend-test:latest
  
      # 2️⃣ Run frontend container
      - name: Run frontend container
        run: docker run -d --name frontend -p 3000:3000 frontend-test:latest
  
      # 3️⃣ Wait for frontend to be ready
      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Frontend is ready!"
              break
            fi
            echo "Waiting for frontend..."
            sleep 2
          done
          if ! curl -s http://localhost:3000 > /dev/null; then
            echo "Frontend failed to start"
            exit 1
          fi
  
      # 4️⃣ Install dependencies & run Cypress
      - name: Install dependencies
        run: npm ci
  
      - name: Run Cypress tests
        run: npx cypress run --browser chrome
        env:
          CYPRESS_BASE_URL: http://localhost:3000
